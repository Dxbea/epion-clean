name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./BackEnd

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: epion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './BackEnd/package-lock.json'

    - name: Install dependencies
      run: npm ci

    # --- NOUVELLES ÉTAPES PRISMA ---
    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Setup Test Database
      # On force Prisma à utiliser notre base de données temporaire pour créer les tables
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/epion_test"
      run: npx prisma db push
    # -------------------------------

    - name: Run Tests
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/epion_test"
        JWT_SECRET: "test_secret_for_ci_pipeline_12345"
        FRONTEND_ORIGIN: "http://localhost:5173"
      run: npm run test


  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./FrontEnd

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './FrontEnd/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build