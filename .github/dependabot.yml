version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/BackEnd"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    target-branch: "main"
    commit-message:
      prefix: "deps(backend)"

  - package-ecosystem: "npm"
    directory: "/FrontEnd"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    target-branch: "main"
    commit-message:
      prefix: "deps(frontend)"