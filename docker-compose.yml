version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: epion_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: epion
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: epion_redis
    ports:
      - "6379:6379"


volumes:
  postgres_data:
